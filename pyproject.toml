[project]
name = "doubao-geo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3,<4",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.156.6",
    "itsdangerous>=2.2.0",
    "pymysql>=1.2.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["mysql: 需要 MYSQL_TEST_URL 指向的真实 MySQL"]
addopts = "-m 'not mysql'"
